name: TodoMenuBar
options:
  bundleIdPrefix: com.anishkothuri
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  TodoMenuBar:
    type: application
    platform: macOS
    sources:
      - TodoMenuBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anishkothuri.TodoMenuBar
        PRODUCT_NAME: TodoMenuBar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TodoMenuBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TodoMenuBarTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TodoMenuBar
schemes:
  TodoMenuBar:
    build:
      targets:
        TodoMenuBar: all
        TodoMenuBarTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TodoMenuBarTests
    archive:
      config: Release
