name: Build and Release DMG

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Pillow
        run: pip3 install --break-system-packages pillow

      - name: Generate app icon
        run: python3 scripts/generate_icon.py

      - name: Build app
        env:
          APP_MARKETING_VERSION: ${{ steps.version.outputs.version }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build.sh

      - name: Run tests
        run: bash scripts/test.sh

      - name: Package DMG
        run: bash scripts/make_dmg.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: "Automated build from main."
          make_latest: true
          files: dist/TodoMenuBar.dmg
